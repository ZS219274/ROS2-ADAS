# 控制模块配置文件

vehicle:
  main_car:
    id: 0
    frame: "base_footprint"
    length: 4.5
    width: 1.8
    pose_x: 0.0
    pose_y: 0.0
    pose_theta: 0.0
    speed_ori: 0.0

pnc_map:
  frame: "map"

# 控制参数
control:
  # 控制类型：0-PID控制器, 1-MPC控制器, 2-LQR控制器
  type: 2
  
  # 控制周期（秒）
  dt: 0.1
  
  # 横向控制（航向角控制）PID参数
  lateral_control:
    kp: 1.5      # 比例系数
    ki: 0.1      # 积分系数
    kd: 0.3      # 微分系数
    max_output: 0.5   # 最大航向角变化率（rad/s）
    min_output: -0.5  # 最小航向角变化率（rad/s）
  
  # 纵向控制（速度控制）PID参数
  longitudinal_control:
    kp: 2.0      # 比例系数
    ki: 0.2      # 积分系数
    kd: 0.1      # 微分系数
    max_output: 3.0   # 最大加速度（m/s²）
    min_output: -3.0  # 最大减速度（m/s²）
  
  # 轨迹无速度规划时的默认目标速度（m/s）
  default_speed: 10.0

  # 前视距离（用于选择目标点）
  lookahead_distance: 5.0
  
  # 车辆参数
  vehicle:
    wheelbase: 2.7  # 轴距（米）

  # MPC控制器参数
  mpc:
    prediction_horizon: 10       # 预测时域步数
    control_horizon: 5           # 控制时域步数
    q_x: 1.0                    # x位置误差权重
    q_y: 1.0                    # y位置误差权重
    q_theta: 2.0                # 航向角误差权重
    q_v: 2.0                    # 速度误差权重
    r_delta: 1.0                # 转向角控制量权重
    r_a: 0.5                    # 加速度控制量权重
    rd_delta: 10.0              # 转向角变化率权重（平滑性）
    rd_a: 5.0                   # 加速度变化率权重（平滑性）
    solver_max_iter: 100         # QP求解器最大迭代次数
    solver_tolerance: 1.0e-4     # QP求解器收敛容差
    max_steering: 0.5            # 最大转向角 (rad, ≈28.6°)

  # LQR控制器参数
  lqr:
    lateral:
      q_lateral_error: 1.0       # Q矩阵：横向位置误差权重
      q_heading_error: 3.0       # Q矩阵：航向角误差权重
      r_steering: 10.0           # R矩阵：转向控制量权重
    longitudinal:
      q_station_error: 1.0       # Q矩阵：纵向位置误差权重
      q_velocity_error: 3.0      # Q矩阵：速度误差权重
      r_acceleration: 1.0        # R矩阵：加速度控制量权重
    max_iteration: 150           # DARE求解最大迭代次数
    tolerance: 1.0e-6            # DARE收敛容差

